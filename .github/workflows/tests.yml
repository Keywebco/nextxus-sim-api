# Federation test timer (EE-2026-11-20-001). Free, built into GitHub.
# Runs the Catalyst memory unit tests on every pull request and every change
# to main. No network, no keys. It only reads and reports. It never merges,
# deploys, or changes anything. Merges still need Roger Keyserling's spoken
# merge word.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Unit tests (no keys needed)
        run: python -m pytest tests -q
